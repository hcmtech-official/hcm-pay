<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HCM Pay — Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='10' fill='%235B57FF'/%3E%3Ccircle cx='50' cy='15' r='6' fill='%237C79FF'/%3E%3Ccircle cx='80' cy='65' r='6' fill='%237C79FF'/%3E%3Ccircle cx='20' cy='65' r='6' fill='%237C79FF'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4" />
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="brand-mark">
      <svg viewBox="0 0 100 100" class="orbit-logo">
        <circle cx="50" cy="50" r="27" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.35"/>
        <circle cx="50" cy="50" r="11" fill="url(#g2)"/>
        <circle cx="50" cy="14" r="6.5" fill="#7C79FF"/>
        <circle cx="81" cy="66" r="6.5" fill="#7C79FF"/>
        <circle cx="19" cy="66" r="6.5" fill="#7C79FF"/>
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5B57FF"/><stop offset="1" stop-color="#7C79FF"/>
          </linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7C79FF"/><stop offset="1" stop-color="#5B57FF"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="brand-lockup">
      <span class="brand-hcm">HCM</span><span class="brand-pay">Pay</span>
    </div>
    <p class="login-tagline">Payment tracking, without the back-and-forth.</p>

    <form id="login-form" class="login-form" autocomplete="off">
      <label class="field">
        <span class="field-label">Username</span>
        <input type="text" id="login-user" placeholder="admin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="off" />
      </label>
      <p id="login-error" class="login-error" hidden>Incorrect username or password.</p>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="login-footnote">One brand. Many worlds. One universe.</p>
  </div>
</div>

<script src="login.js?v=4"></script>
</body>
</html>
